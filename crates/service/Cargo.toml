[package]
name = "v6alias-service"
version = "0.1.0"
edition = "2024"
description = "Offline inventory, policy, allocation and reconciliation for V6Alias"

[dependencies]
v6alias-core = { path = "../core" }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3"
