[package]
name = "v6alias"
version = "0.1.0"
edition = "2024"
default-run = "v6alias"
description = "Human-friendly aliases for managed IPv6 ULA addresses"
repository = "https://github.com/ian-treleaven-outlook/v6alias"
readme = "README.md"
keywords = ["ipv6", "ula", "networking", "dhcpv6"]
categories = ["command-line-utilities", "network-programming"]

[workspace]
members = ["crates/core", "crates/service"]
default-members = [".", "crates/core", "crates/service"]
resolver = "3"

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
network-interface = "2.0.5"
serde = "1.0.229"
serde_json = "1.0"
thiserror = "2.0.20"
v6alias-core = { path = "crates/core" }
v6alias-service = { path = "crates/service" }

[dev-dependencies]
tempfile = "3"
