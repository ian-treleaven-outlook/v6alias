name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -B -m unittest discover -s scripts/tests -p "test_*.py"
      - name: PHP router helper and Rust contract (synthetic local files only)
        if: matrix.os == 'ubuntu-latest'
        run: php scripts/tests/test_pfsense.php --rust-bin-dir "$PWD/target/debug"
      - name: PowerShell lab helper tests (offline mocks only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\tests\Test-LabHelpers.ps1
          .\scripts\tests\Test-LiveDemo.ps1
          .\scripts\tests\Test-ServerCoreHarness.ps1
      - name: Bash demo shortcuts (offline mocks only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash -n scripts/live-demo.bash
          bash -n scripts/demo-shell.bash
          bash scripts/tests/test_demo_shell.bash
      - name: PowerShell demo shortcuts (offline mocks only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\tests\Test-DemoShortcuts.ps1
      - name: Native Windows integration and approval bundles (offline only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bins = Join-Path $PWD 'target\debug'
          .\scripts\tests\Test-IscCollector.ps1 -BinaryDirectory $bins
          .\scripts\tests\Test-PfsenseNative.ps1 -BinaryDirectory $bins
          .\scripts\tests\Test-PfsenseChangeBundle.ps1 -BinaryDirectory $bins
